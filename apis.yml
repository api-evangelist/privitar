name: Privitar
description: 'Privitar was a UK-founded data privacy and data provisioning company known for its Data
  Privacy Platform, which applied de-identification, anonymization, tokenization and policy-based data
  access controls to sensitive data at scale for enterprises in financial services, healthcare and
  government. Privitar was acquired by Informatica in 2023 and folded into Informatica''s data governance
  and privacy portfolio. As of this enrichment pass the privitar.com domain (and docs.privitar.com)
  permanently redirects (HTTP 301) to informatica.com, and no independent Privitar developer portal,
  API documentation, or API surface remains online. This profile is retained as a network lead record
  for the former company; live API artifacts now belong to Informatica.'
